# WIMS-BFP client edge gateway (one office PC, LAN only).
#
# TLS 1.3 only. Certificates come from setup-certs.ps1 (local CA):
#   /etc/nginx/certs/server.crt, server.key  (mounted from deploy/client/certs/server)
# Routing follows src/nginx/nginx.conf minus everything civilian/public/Turnstile/bot-blocker:
# there are no /api/civilian, /api/v1/public or other public-intake locations.
#
# server_name: the placeholders below are rewritten by install.ps1 (WIMS_HOST, WIMS_SERVER_IP)
# into runtime/nginx.conf; the file in git keeps the defaults.

events {
    worker_connections 512;
}

http {
    server_tokens off;
    proxy_hide_header X-Powered-By;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend_servers {
        zone backend_servers 64k;
        server backend:8000 resolve;
        keepalive 16;
    }

    upstream frontend_servers {
        zone frontend_servers 64k;
        server frontend:3000 resolve;
    }

    upstream keycloak_servers {
        zone keycloak_servers 64k;
        server keycloak:8080 resolve;
    }

    # AFOR workbook / attachment uploads.
    client_max_body_size 50M;

    # Slowloris hardening.
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     65s;
    send_timeout          30s;

    # Per-IP limits. Office PCs share one NAT-free LAN, so keys are real client addresses.
    limit_req_zone  $binary_remote_addr zone=general_api:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=keycloak_api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    map $request_method $reset_post_only {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone  $reset_post_only zone=reset_credentials:10m rate=1r/m;

    limit_req_status  429;
    limit_conn_status 429;

    # ── HTTP -> HTTPS ──────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","via":"nginx"}\n';
        }

        location / {
            return 301 https://wims.bfp.lan$request_uri;
        }
    }

    # Anything that reaches 443 with an unknown Host (e.g. the bare IP) is refused: the
    # app only works under the fixed hostname because OIDC redirects and cookies depend on it.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.3;

        return 421;
    }

    # ── WIMS ───────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name wims.bfp.lan 192.168.1.50;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:5m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        # Next.js emits inline bootstrap scripts, hence 'unsafe-inline' for scripts/styles.
        # Map tiles are the only third-party origin (they simply fail while offline).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://*.tile.openstreetmap.org; font-src 'self' data:; worker-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","via":"nginx"}\n';
        }

        # Server-sent events: no buffering, long timeouts.
        location = /api/events/stream {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Next.js route handlers under /api/auth must reach the frontend, not the backend.
        location ~ ^/api/auth/(session|sync|refresh|logout)$ {
            proxy_pass http://frontend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req  zone=general_api burst=50 nodelay;
            limit_conn addr 30;

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Password-reset abuse protection (POST only).
        location = /auth/realms/bfp/login-actions/reset-credentials {
            limit_req  zone=reset_credentials burst=2 nodelay;
            limit_conn addr 10;

            proxy_pass http://keycloak_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Keycloak static assets are exempt from the auth rate limit (code-split admin console).
        location /auth/resources/ {
            proxy_pass http://keycloak_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /auth/ {
            limit_req  zone=keycloak_api burst=30 nodelay;
            limit_conn addr 20;

            proxy_pass http://keycloak_servers;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Internal Prometheus target; never exposed.
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://frontend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
