# Opt-in overlay: run the OSRM road-routing integration on the LOCAL stack.
#
# Not used by production, CI or the default local stack. Layer it on top of the
# base file AND docker-compose.local-demo.yml, from PowerShell, no host bash:
#
#   docker compose --project-name wims-local --env-file .env.example `
#     --project-directory src `
#     -f src/docker-compose.yml -f src/docker-compose.local-demo.yml `
#     -f src/docker-compose.local-osrm.yml `
#     up --build -d --wait <explicit service list, see README>
#
# Adds: osrm-fetch (verified download or offline drop-in) -> osrm-prepare
# (extract/partition/customize) -> osrm (routing server) and a celery-worker
# that consumes tasks.routing.compute_routing. Dataset pin: src/osrm/metro-manila.env.
#
# Static addresses assume the default local subnet 172.28.0.0/24. With a custom
# WIMS_LOCAL_SUBNET set WIMS_LOCAL_OSRM_IP / WIMS_LOCAL_CELERY_IP inside it.

volumes:
  osrm_data:

services:
  # Step 1: get a SHA-256-verified .pbf into the volume. Skips when the verified
  # file is already there. Offline: drop metro_manila.osm.pbf in src/osrm/input/.
  osrm-fetch:
    image: alpine:3.20
    container_name: wims-local-osrm-fetch
    restart: "no"
    volumes:
      - osrm_data:/data
      - ./osrm/metro-manila.env:/pin/metro-manila.env:ro
      # Optional: an empty directory is fine; the script then downloads.
      - ./osrm/input:/input:ro
    command:
      - sh
      - -ec
      - |
        # Strip CR: a Windows checkout (autocrlf) may give the pin file CRLF endings.
        tr -d '\r' < /pin/metro-manila.env > /tmp/pin.env
        . /tmp/pin.env
        dir="/data/$$OSRM_DATA_VERSION"
        pbf="$$dir/metro-manila.osm.pbf"
        mkdir -p "$$dir"
        verify() { echo "$$OSRM_PBF_SHA256  $$1" | sha256sum -c -; }
        if [ -s "$$pbf" ] && verify "$$pbf" >/dev/null 2>&1; then
          echo "osrm-fetch: verified $$pbf already present, skipping"
          exit 0
        fi
        rm -f "$$pbf" "$$pbf.part"
        if [ -s /input/metro_manila.osm.pbf ]; then
          echo "osrm-fetch: using offline file from src/osrm/input/"
          cp /input/metro_manila.osm.pbf "$$pbf.part"
        else
          echo "osrm-fetch: downloading $$OSRM_PBF_URL"
          wget -q -O "$$pbf.part" "$$OSRM_PBF_URL"
        fi
        if ! verify "$$pbf.part"; then
          echo "osrm-fetch: SHA-256 mismatch against src/osrm/metro-manila.env pin" >&2
          rm -f "$$pbf.part"
          exit 1
        fi
        mv "$$pbf.part" "$$pbf"
        echo "osrm-fetch: ok ($$OSRM_DATA_VERSION)"
    networks:
      wims_internal: {}

  # Step 2: build the MLD routing files and the `active` symlink. Skips when they exist.
  osrm-prepare:
    image: osrm/osrm-backend:v5.25.0
    container_name: wims-local-osrm-prepare
    restart: "no"
    volumes:
      - osrm_data:/data
      - ./osrm/metro-manila.env:/pin/metro-manila.env:ro
    entrypoint:
      - sh
      - -ec
      - |
        # Strip CR: a Windows checkout (autocrlf) may give the pin file CRLF endings.
        tr -d '\r' < /pin/metro-manila.env > /tmp/pin.env
        . /tmp/pin.env
        dir="/data/$$OSRM_DATA_VERSION"
        if [ -s "$$dir/metro-manila.osrm" ] && [ -s "$$dir/metro-manila.osrm.cells" ] \
           && [ -s "$$dir/metro-manila.osrm.partition" ]; then
          echo "osrm-prepare: routing files already present, skipping"
        else
          osrm-extract -p /opt/car.lua "$$dir/metro-manila.osm.pbf"
          osrm-partition "$$dir/metro-manila.osrm"
          osrm-customize "$$dir/metro-manila.osrm"
        fi
        # Relative target so it also resolves inside the osrm container's /data mount.
        ln -sfn "$$OSRM_DATA_VERSION" /data/active
        echo "osrm-prepare: active -> $$OSRM_DATA_VERSION"
    depends_on:
      osrm-fetch:
        condition: service_completed_successfully
    networks:
      wims_internal: {}

  # Step 3: the routing server. Same command and healthcheck as docker-compose.prod.yml.
  osrm:
    image: osrm/osrm-backend:v5.25.0
    container_name: wims-local-osrm
    command: ["osrm-routed", "--algorithm", "mld", "--verbosity", "WARNING", "/data/active/metro-manila.osrm"]
    restart: "no"
    volumes:
      - osrm_data:/data:ro
    # LOCAL-ONLY EXCEPTION: production publishes no OSRM port (docs/operations/osrm-routing.md
    # privacy boundary). Published on loopback here for curl checks and load testing.
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/active/metro-manila.osrm.cells && test -f /data/active/metro-manila.osrm.partition"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1gb
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_OSRM_IP:-172.28.0.9}

  backend:
    environment:
      - OSRM_BASE_URL=http://osrm:5000
    extra_hosts:
      - "osrm:${WIMS_LOCAL_OSRM_IP:-172.28.0.9}"

  # Same database configuration as production: DATABASE_URL only (wims_app_user).
  # Deliberately NO DATABASE_ADMIN_URL; see the README note on the routing task.
  celery-worker:
    environment:
      - OSRM_BASE_URL=http://osrm:5000
    extra_hosts: !override
      - "postgres:${WIMS_LOCAL_POSTGRES_IP:-172.28.0.3}"
      - "redis:${WIMS_LOCAL_REDIS_IP:-172.28.0.5}"
      - "keycloak:${WIMS_LOCAL_KEYCLOAK_IP:-172.28.0.7}"
      - "osrm:${WIMS_LOCAL_OSRM_IP:-172.28.0.9}"
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm:
        condition: service_healthy
    volumes: !override
      - incident_attachments_data:/app/storage
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_CELERY_IP:-172.28.0.133}
